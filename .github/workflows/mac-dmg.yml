name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install dmg-license --no-save # darwin-only dep, absent from the Windows-made lockfile
      # each arch gets a matching ffmpeg-static binary - one shared node_modules
      # packs the runner's own arch into both dmgs (spawn error -86 on the other)
      - run: node scripts/make-icon.cjs
      - run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build, no Apple cert needed
      # ffmpeg-static's installer skips the download while a binary exists -
      # delete the arm64 one first or the x64 dmg ships the wrong CPU again
      - run: rm -f node_modules/ffmpeg-static/ffmpeg && npm rebuild ffmpeg-static
        env:
          npm_config_arch: x64
      - run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Server-dmg
          path: dist-electron/*.dmg
      - name: Publish to GitHub Release (permanent download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "WhatsApp Server" --notes "Latest macOS build" || true
          gh release upload latest dist-electron/*.dmg --clobber
